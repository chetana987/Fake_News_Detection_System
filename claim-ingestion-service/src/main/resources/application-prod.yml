spring:
  datasource:
    url: jdbc:postgresql://prod-db:5432/claim_ingestion
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  kafka:
    bootstrap-servers: prod-kafka:9092
    producer:
      properties:
        acks: all
        retries: 3

logging:
  level:
    com.misinfo: WARN

api:
  key: ${API_KEY}

cors:
  allowed:
    origins: https://misinfo.app,https://admin.misinfo.app

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
